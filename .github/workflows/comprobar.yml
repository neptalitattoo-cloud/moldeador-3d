name: comprobar
on: [push, pull_request]
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 herramientas/version_sw.py --check
      - run: node --test tests/fit.test.mjs
