name: comprobar
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estilo:
    name: ESLint (0 avisos) y Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  unidad:
    name: Pruebas (ajuste, fuzz, golden), versión y CSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Versión de caché coherente y hash de archivos al día
        run: python3 herramientas/version_sw.py --check
      - name: El hash de la CSP coincide con el importmap
        run: python3 herramientas/check_csp.py
      - run: node --test tests/fit.test.mjs

  python-usd:
    name: Herramientas Python y validación USD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: herramientas/requirements.txt }
      - run: pip install -r herramientas/requirements.txt
      - name: load_base() lee el .bin del repo
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: USDZ con nombres difíciles validados por USD (0 errores)
        run: |
          node tests/make_usdz.mjs usdz-prueba
          python3 herramientas/validar_usdz.py usdz-prueba/*.usdz

  e2e:
    name: E2E (Playwright, WebKit + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Instalar WebKit
        id: webkit
        continue-on-error: true # si WebKit no se puede instalar en el runner, queda Chromium como respaldo
        run: npx playwright install --with-deps webkit
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E en WebKit (lo más parecido a Safari del iPad)
        if: steps.webkit.outcome == 'success'
        run: npx playwright test --project=webkit
      - name: E2E en Chromium
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
